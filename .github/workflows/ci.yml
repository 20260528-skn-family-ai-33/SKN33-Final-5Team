# Runs the same checks on the team's two environments (macOS 3, Windows 2) for every push to main and every PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node packages
        run: npm --prefix Frontend ci

      - name: Install Python environment
        run: npm --prefix Frontend run setup
        env:
          A4B_SETUP_PYTHON: ${{ steps.python.outputs.python-path }}

      - name: Type check
        run: npm --prefix Frontend run check

      - name: Python tests
        run: npm --prefix Frontend run test:python

      - name: Build and server tests
        run: npm --prefix Frontend test
