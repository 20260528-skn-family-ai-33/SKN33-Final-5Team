name: Deploy A4B to EC2
run-name: A4B ${{ inputs.operation == 'restore' && 'restore' || format('{0} ({1})', inputs.branch || 'main', inputs.target || 'auto') }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy or restore the version saved before testing
        type: choice
        default: deploy
        options: [deploy, restore]
      branch:
        description: Branch to deploy (ignored for restore)
        required: true
        default: main
        type: string
      target:
        description: Deployment area (ignored for restore)
        type: choice
        default: auto
        options: [auto, all, frontend, backend, ocr]

permissions:
  contents: read

concurrency:
  group: a4b-ec2-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2

jobs:
  plan:
    if: github.ref == 'refs/heads/main' && inputs.operation != 'restore'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      commit: ${{ steps.select.outputs.commit }}
      targets: ${{ steps.select.outputs.targets }}
      mode: ${{ steps.select.outputs.mode }}
      build: ${{ steps.select.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.A4B_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Read deployed commits and select components
        id: select
        shell: bash
        env:
          INSTANCE_ID: ${{ vars.A4B_EC2_INSTANCE_ID }}
          ECR_REPOSITORY: ${{ vars.A4B_ECR_REPOSITORY }}
          DEPLOY_BRANCH: ${{ inputs.branch || 'main' }}
          TARGET: ${{ inputs.target || 'auto' }}
        run: |
          set -euo pipefail
          mode=production
          commit="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$DEPLOY_BRANCH" != main ]]; then
            mode=test
            git check-ref-format "refs/heads/$DEPLOY_BRANCH"
            commit=$(git rev-parse --verify "refs/remotes/origin/$DEPLOY_BRANCH^{commit}")
          fi
          bash scripts/a4b-ssm-command.sh 'p=/var/lib/a4b-deploy/components.json; if test -f "$p"; then cat "$p"; else echo "{}"; fi' > "$RUNNER_TEMP/deployed.json"
          targets=$(python3 scripts/a4b-deploy-targets.py "$RUNNER_TEMP/deployed.json" "$TARGET" "$commit" "$mode")
          if [[ "$targets" != '[]' ]]; then
            bash scripts/a4b-ssm-command.sh 'set -e
              docker compose version
              df -h /
              free -m
              if [ ! -f /var/lib/a4b-deploy/components.json ]; then
                available_kib=$(awk "\$1 == \"MemAvailable:\" {print \$2}" /proc/meminfo)
                free_kib=$(df -Pk / | awk "NR == 2 {print \$4}")
                if [ "$available_kib" -lt 2097152 ] || [ "$free_kib" -lt 6291456 ]; then
                  echo "Split migration requires 2 GiB available RAM and 6 GiB free disk" >&2
                  exit 1
                fi
              fi'
          fi
          [[ "$ECR_REPOSITORY" =~ ^[0-9]{12}\.dkr\.ecr\.ap-northeast-2\.amazonaws\.com/[a-z0-9][a-z0-9._/-]*$ ]]
          build='[]'
          while IFS= read -r component; do
            digest=$(aws ecr batch-get-image --repository-name "${ECR_REPOSITORY#*/}" \
              --image-ids "imageTag=$component-$commit" --query 'images[0].imageId.imageDigest' --output text)
            if [[ "$digest" == None ]]; then
              build=$(jq -c --arg component "$component" '. + [$component]' <<< "$build")
            fi
          done < <(jq -r '.[]' <<< "$targets")
          printf 'commit=%s\ntargets=%s\nmode=%s\nbuild=%s\n' "$commit" "$targets" "$mode" "$build" >> "$GITHUB_OUTPUT"
          printf 'Selected commit %s and components %s\n' "$commit" "$targets"

  verify-and-build:
    needs: plan
    if: needs.plan.outputs.build != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Set up Python workers for integration tests
        run: |
          bash Backend/scripts/setup-agent-demo.sh
          bash Backend/scripts/setup-document-analysis.sh
      - run: npm run check
      - run: npm test
      - uses: docker/setup-buildx-action@v3
      - name: Generate BuildKit configuration
        shell: bash
        env:
          TARGETS: ${{ needs.plan.outputs.build }}
        run: |
          mkdir -p "$RUNNER_TEMP/a4b-images"
          jq 'def settings($c): {
                context: ".", target: (if $c=="ocr" then "ocr-cpu" else $c end),
                tags: ["a4b-ci:"+$c], output: ["type=docker"],
                "cache-from": ["type=gha,scope=a4b-"+$c],
                "cache-to": ["type=gha,scope=a4b-"+$c+",mode=max"]
              }; {group:{default:{targets:.}},target:(map({key:.,value:settings(.)})|from_entries)}' \
            <<< "$TARGETS" > "$RUNNER_TEMP/a4b-bake.json"
      - name: Build selected components
        uses: docker/bake-action@v6
        with:
          source: .
          files: ${{ runner.temp }}/a4b-bake.json
      - name: Package selected components
        shell: bash
        env:
          TARGETS: ${{ needs.plan.outputs.build }}
        run: |
          set -euo pipefail
          while IFS= read -r component; do
            docker save "a4b-ci:$component" | gzip > "$RUNNER_TEMP/a4b-images/$component.tar.gz"
          done < <(jq -r '.[]' <<< "$TARGETS")
      - uses: actions/upload-artifact@v4
        with:
          name: a4b-components
          path: ${{ runner.temp }}/a4b-images
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
          overwrite: true

  deploy:
    needs: [plan, verify-and-build]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
          (inputs.operation == 'restore' ||
           (needs.plan.result == 'success' && needs.plan.outputs.targets != '[]' &&
            (needs.plan.outputs.build == '[]' || needs.verify-and-build.result == 'success'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      ECR_REPOSITORY: ${{ vars.A4B_ECR_REPOSITORY }}
      INSTANCE_ID: ${{ vars.A4B_EC2_INSTANCE_ID }}
      PUBLIC_URL: ${{ vars.A4B_PUBLIC_URL }}
      DEPLOY_SHA: ${{ needs.plan.outputs.commit }}
      DEPLOY_MODE: ${{ needs.plan.outputs.mode }}
      TARGETS: ${{ needs.plan.outputs.targets }}
      OPERATION: ${{ inputs.operation || 'deploy' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: inputs.operation != 'restore' && needs.plan.outputs.build != '[]'
        with:
          name: a4b-components
          path: ${{ runner.temp }}/a4b-images
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.A4B_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Publish selected images and apply release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PUBLIC_URL" =~ ^https://[a-z0-9.-]+$ ]]
          [[ "$ECR_REPOSITORY" =~ ^[0-9]{12}\.dkr\.ecr\.ap-northeast-2\.amazonaws\.com/[a-z0-9][a-z0-9._/-]*$ ]]
          [[ "$OPERATION" =~ ^(deploy|restore)$ ]]
          images='{}'
          if [[ "$OPERATION" == deploy ]]; then
            [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
            registry=${ECR_REPOSITORY%%/*}
            aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
            while IFS= read -r component; do
              [[ "$component" =~ ^(frontend|backend|ocr)$ ]]
              tag="$component-$DEPLOY_SHA"
              image="$ECR_REPOSITORY:$tag"
              digest=$(aws ecr batch-get-image --repository-name "${ECR_REPOSITORY#*/}" \
                --image-ids "imageTag=$tag" --query 'images[0].imageId.imageDigest' --output text)
              if [[ "$digest" == None ]]; then
                docker load --input "$RUNNER_TEMP/a4b-images/$component.tar.gz"
                docker tag "a4b-ci:$component" "$image"
                docker push "$image"
              fi
              images=$(jq -c --arg key "$component" --arg value "$image" '.[$key]=$value' <<< "$images")
            done < <(jq -r '.[]' <<< "$TARGETS")
          fi
          request=$(jq -cn --arg operation "$OPERATION" --arg mode "$DEPLOY_MODE" --arg repo "$ECR_REPOSITORY" --argjson images "$images" \
            '{operation:$operation, mode:$mode, repository:$repo, images:$images}' | base64 -w 0)
          script=$(base64 -w 0 scripts/deploy-a4b-components.py)
          compose=$(base64 -w 0 docker-compose.production.yml)
          legacy=$(base64 -w 0 scripts/deploy-a4b-ec2.sh)
          remote="if [ '$OPERATION' = restore ] && [ ! -f /var/lib/a4b-deploy/components.json ]; then printf '%s' '$legacy' | base64 -d | bash -s -- restore '$PUBLIC_URL'; else printf '%s' '$script' | base64 -d | python3 - '$request' '$PUBLIC_URL' '$compose'; fi"
          bash scripts/a4b-ssm-command.sh "$remote"
