name: Deploy A4B to EC2

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/deploy.yml
      - scripts/deploy-a4b-ec2.sh
      - scripts/a4b-ssm-command.sh
      - scripts/a4b-ssm-release.sh
      - scripts/a4b-frontend-release.py
      - scripts/a4b-deploy-targets.py
      - scripts/deploy-a4b-frontend.sh
      - docs/a4b-automatic-deployment.md
  workflow_dispatch:
    inputs:
      operation:
        description: 배포 또는 복귀
        type: choice
        default: deploy
        options: [deploy, restore]
      target:
        description: 배포할 영역 (복귀 시 무시)
        type: choice
        default: auto
        options: [auto, all, frontend, backend]
      branch:
        description: 배포할 브랜치 (복귀 시 무시)
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: a4b-ec2-production
  cancel-in-progress: false

jobs:
  resolve-image:
    if: github.ref == 'refs/heads/main' && inputs.operation != 'restore'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      cached: ${{ steps.source.outputs.cached }}
      target: ${{ steps.source.outputs.target }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.A4B_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: Resolve the commit and check for a verified image
        id: source
        shell: bash
        env:
          DEPLOY_BRANCH: ${{ inputs.branch }}
          DEPLOY_TARGET: ${{ inputs.target || 'auto' }}
          INSTANCE_ID: ${{ vars.A4B_EC2_INSTANCE_ID }}
          ECR_REPOSITORY: ${{ vars.A4B_ECR_REPOSITORY }}
          AWS_REGION: ap-northeast-2
        run: |
          set -euo pipefail
          commit="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$DEPLOY_BRANCH" != main ]]; then
            git check-ref-format "refs/heads/$DEPLOY_BRANCH"
            commit=$(git rev-parse --verify "refs/remotes/origin/$DEPLOY_BRANCH^{commit}")
          fi
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          target=$DEPLOY_TARGET
          if [[ "$target" == auto ]]; then
            live=$(bash scripts/a4b-ssm-command.sh 'set -eu; app=a4b-jhd-aws; docker exec "$app" grep -oE "a4b-release=[0-9a-f]{40}" /app/Frontend/dist-app/index.html | cut -d= -f2 || true; docker inspect -f "{{.Config.Image}}" "$app"')
            backend=$(tail -n 1 <<< "$live" | sed -nE 's/.*:(verified-|backend-)?([0-9a-f]{40})(-[0-9]+-[0-9]+)?$/\2/p')
            frontend=$(head -n 1 <<< "$live" | sed -nE '/^[0-9a-f]{40}$/p')
            target=$(python3 scripts/a4b-deploy-targets.py "$commit" "$frontend" "$backend")
          fi
          case "$target" in
            none) echo 'target=none' >> "$GITHUB_OUTPUT"; exit 0 ;;
            all) prefix=verified ;;
            frontend|backend) prefix=$target ;;
            *) exit 1 ;;
          esac
          tag="$prefix-$commit"
          response=$(aws ecr batch-get-image --repository-name "${ECR_REPOSITORY#*/}" \
            --image-ids "imageTag=$tag" --output json)
          if jq -e '.images[0].imageId.imageDigest | test("^sha256:[0-9a-f]{64}$")' <<< "$response" >/dev/null 2>&1; then
            cached=true
          elif jq -e '.failures | length == 1 and .[0].failureCode == "ImageNotFound"' <<< "$response" >/dev/null; then
            cached=false
          else
            echo 'Unable to determine if the verified image exists' >&2
            exit 1
          fi
          printf 'commit=%s\ncached=%s\ntarget=%s\ntag=%s\n' "$commit" "$cached" "$target" "$tag" >> "$GITHUB_OUTPUT"
          echo "Commit $commit, verified image available: $cached"

  verify-and-build:
    needs: resolve-image
    if: needs.resolve-image.outputs.cached == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-image.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        if: needs.resolve-image.outputs.target != 'frontend'
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Set up Python workers for integration tests
        if: needs.resolve-image.outputs.target != 'frontend'
        run: |
          bash Backend/scripts/setup-agent-demo.sh
          bash Backend/scripts/setup-document-analysis.sh
      - run: npm run check
        if: needs.resolve-image.outputs.target != 'frontend'
      - run: npm test
        if: needs.resolve-image.outputs.target != 'frontend'
      - name: Check and test frontend
        if: needs.resolve-image.outputs.target == 'frontend'
        run: |
          npx tsc -p Frontend --noEmit --incremental false
          node --import tsx --test "Frontend/tests/*.test.ts"
      - uses: docker/setup-buildx-action@v3
      - name: Build the tested commit with layer caching
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ needs.resolve-image.outputs.target == 'all' && 'standalone' || needs.resolve-image.outputs.target }}
          build-args: A4B_FRONTEND_COMMIT=${{ needs.resolve-image.outputs.commit }}
          load: true
          tags: a4b-ci:${{ needs.resolve-image.outputs.commit }}
          cache-from: |
            type=gha,scope=a4b-monolith
            type=gha,scope=a4b-frontend
          cache-to: type=gha,scope=${{ needs.resolve-image.outputs.target == 'frontend' && 'a4b-frontend' || 'a4b-monolith' }},mode=max,ignore-error=true
      - name: Package the tested image
        shell: bash
        env:
          DEPLOY_SHA: ${{ needs.resolve-image.outputs.commit }}
        run: |
          set -euo pipefail
          docker save "a4b-ci:$DEPLOY_SHA" | gzip > "$RUNNER_TEMP/a4b-image.tar.gz"
      - name: Upload the image for the deployment job
        uses: actions/upload-artifact@v4
        with:
          name: a4b-image
          path: ${{ runner.temp }}/a4b-image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
          overwrite: true

  deploy:
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.resolve-image.result == 'success' &&
          (needs.resolve-image.outputs.cached == 'true' || needs.verify-and-build.result == 'success') }}
    needs: [resolve-image, verify-and-build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: ${{ vars.A4B_ECR_REPOSITORY }}
      INSTANCE_ID: ${{ vars.A4B_EC2_INSTANCE_ID }}
      PUBLIC_URL: ${{ vars.A4B_PUBLIC_URL }}
      DEPLOY_SHA: ${{ needs.resolve-image.outputs.commit }}
      IMAGE_CACHED: ${{ needs.resolve-image.outputs.cached }}
      IMAGE_TAG: ${{ needs.resolve-image.outputs.tag }}
    steps:
      - name: Check out the deployment script from main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: deployment
          persist-credentials: false
      - name: Download the tested image
        if: needs.resolve-image.outputs.cached != 'true'
        uses: actions/download-artifact@v4
        with:
          name: a4b-image
          path: ${{ runner.temp }}
      - name: Load the tested image
        if: needs.resolve-image.outputs.cached != 'true'
        run: docker load --input "$RUNNER_TEMP/a4b-image.tar.gz"
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.A4B_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Publish the tested commit to ECR
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ECR_REPOSITORY" =~ ^[0-9]{12}\.dkr\.ecr\.ap-northeast-2\.amazonaws\.com/[a-z0-9][a-z0-9._/-]*$ ]]
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_TAG" =~ ^(verified|backend|frontend)-[0-9a-f]{40}$ ]]
          image="$ECR_REPOSITORY:$IMAGE_TAG"
          if [[ "$IMAGE_CACHED" != true ]]; then
            # A failed deployment may already have published this immutable tag.
            digest=$(aws ecr batch-get-image --repository-name "${ECR_REPOSITORY#*/}" \
              --image-ids "imageTag=$IMAGE_TAG" --query 'images[0].imageId.imageDigest' --output text)
            if [[ "$digest" == None ]]; then
              registry=${ECR_REPOSITORY%%/*}
              aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
              docker tag "a4b-ci:$DEPLOY_SHA" "$image"
              docker push "$image"
            fi
          fi
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
      - name: Deploy over AWS Systems Manager
        shell: bash
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          DEPLOY_BRANCH: ${{ inputs.branch || 'main' }}
        run: |
          set -euo pipefail
          mode=production
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$DEPLOY_BRANCH" != main ]]; then
            mode=test
          fi
          bash deployment/scripts/a4b-ssm-release.sh "$IMAGE" "$PUBLIC_URL" "$mode"

  restore:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'restore'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      INSTANCE_ID: ${{ vars.A4B_EC2_INSTANCE_ID }}
      PUBLIC_URL: ${{ vars.A4B_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.A4B_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Restore the pre-test release
        run: bash scripts/a4b-ssm-release.sh restore "$PUBLIC_URL"
