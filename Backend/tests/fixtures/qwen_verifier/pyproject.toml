[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a4b-qwen-verifier"
version = "0.1.0"
description = "A4B separate classifier/verifier integration starter"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3", "jsonschema>=4.21,<5"]

[tool.setuptools.packages.find]
include = ["a4b_verifier*"]

[tool.setuptools.package-data]
a4b_verifier = ["registry.json"]
