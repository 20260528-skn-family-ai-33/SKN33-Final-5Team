<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">A4B — Automation for Business</title>
  <desc id="desc">문서에서 시작하는 업무 자동화. 업무를 설계하고, 검토한 기준을 저장하고, 같은 기준으로 다시 실행합니다.</desc>
  <defs>
