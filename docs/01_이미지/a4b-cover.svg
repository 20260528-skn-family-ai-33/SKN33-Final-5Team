    <path d="m794 170 6 4-6 4m184-8 6 4-6 4" fill="none" stroke="#E4C5B1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#183A55" stroke="#557B99">
      <rect x="618" y="108" width="148" height="132" rx="16"/>
      <rect x="802" y="108" width="148" height="132" rx="16"/>
      <rect x="986" y="108" width="148" height="132" rx="16"/>
