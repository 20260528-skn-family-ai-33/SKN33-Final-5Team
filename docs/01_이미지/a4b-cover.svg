      <text x="638" y="137">01</text><text x="822" y="137">02</text><text x="1006" y="137">03</text>
    </g>
    <g font-size="25" font-weight="650" fill="#F4F8FC">
      <text x="638" y="181">설계</text><text x="822" y="181">저장</text><text x="1006" y="181">실행</text>
