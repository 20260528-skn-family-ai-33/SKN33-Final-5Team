    <text x="64" y="158" font-size="19" font-weight="500" letter-spacing=".6" fill="#BDCFDD">Automation for Business</text>
    <text x="64" y="208" font-size="25" font-weight="650" letter-spacing="-.7" fill="#F4F8FC">문서에서 시작하는 업무 자동화</text>
    <text x="64" y="238" font-size="15" fill="#B4C9D9">한 번 정한 업무 기준을, 다음 자료에도 그대로.</text>
    <text x="64" y="295" font-size="11" font-weight="650" letter-spacing="2.2" fill="#F0CCB5">SKN33 FINAL PROJECT · TEAM 05</text>
