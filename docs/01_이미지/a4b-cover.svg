      <stop stop-color="#10283F"/><stop offset="1" stop-color="#1D4565"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#B9D2E4" opacity=".10"/>
    </pattern>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#7198B7"/><stop offset="1" stop-color="#F0CCB5"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="338" rx="24" fill="url(#bg)" stroke="#496D89"/>
  <rect x="550" y="2" width="648" height="336" rx="23" fill="url(#dots)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
