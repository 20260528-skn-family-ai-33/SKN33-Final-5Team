<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="256" viewBox="0 0 1200 256" role="img" aria-labelledby="title desc">
  <title id="title">A4B Workflow Studio</title>
  <desc id="desc">A4B brand mark and three connected stages showing design, save and run.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#102943"/>
      <stop offset="1" stop-color="#214f74"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#bfd9ed" opacity=".17"/>
    </pattern>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0L7 3.5L0 7" fill="none" stroke="#8db6d5" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="254" rx="24" fill="url(#background)" stroke="#4f7799"/>
  <rect x="2" y="2" width="1196" height="252" rx="24" fill="url(#grid)"/>
  <g transform="translate(56 88) scale(2.5)">
    <rect width="32" height="32" rx="7" fill="#244d73" stroke="#527a9b" stroke-width=".45"/>
    <path fill="#fff" fill-rule="evenodd" d="M5.5 25 12.9 7h5.7L26 25h-5.7l-1.5-4.1h-6.9L10.4 25H5.5Zm8-8.5h3.7L15.4 11l-1.9 5.5Z"/>
    <rect x="23" y="22" width="6" height="6" rx="1.5" fill="#f0ccb5"/>
  </g>
  <g font-family="system-ui, sans-serif">
    <text x="162" y="111" font-size="14" font-weight="650" letter-spacing="3.2" fill="#f0ccb5">SKN33 FINAL PROJECT</text>
    <text x="159" y="154" font-size="35" font-weight="720" fill="#f4f8fc">Workflow Studio</text>
    <g fill="#163652" stroke="#648eaf">
      <rect x="535" y="83" width="159" height="90" rx="14"/>
      <rect x="744" y="83" width="159" height="90" rx="14"/>
      <rect x="953" y="83" width="159" height="90" rx="14"/>
    </g>
    <g font-size="12" fill="#f0ccb5" font-weight="700" letter-spacing="1.6">
      <text x="555" y="112">01</text><text x="764" y="112">02</text><text x="973" y="112">03</text>
    </g>
    <g font-size="22" fill="#f4f8fc" font-weight="640">
      <text x="555" y="145">Design</text><text x="764" y="145">Save</text><text x="973" y="145">Run</text>
    </g>
    <g stroke="#8db6d5" stroke-width="1.8" marker-end="url(#arrow)">
